[package]
name = "hoogle-syntax"
version = "0.1.2"
edition = "2021"
description = "Haskell syntax highlighting and tokenization for hoogle-tui"
license = "MIT"
repository = "https://github.com/joshburgess/hoogle-tui"
readme = "../../README.md"
keywords = ["haskell", "syntax-highlighting"]
categories = ["text-processing"]

[dependencies]
serde = { workspace = true }
unicode-width = "0.2"
ratatui = "0.29"
toml = "0.8"
